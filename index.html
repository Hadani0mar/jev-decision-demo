<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JEV Decision Demo</title>
  <meta name="description" content="تجربة مباشرة لنموذج TypeSafe AI JEV لاتخاذ قرار من نص." />
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#09090b;color:#fafafa;display:grid;place-items:center;padding:24px}
    .shell{width:min(760px,100%);background:#111114;border:1px solid #27272a;border-radius:24px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
    .eyebrow{font-size:13px;color:#a1a1aa;margin-bottom:10px}
    h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px);letter-spacing:-.03em}
    .sub{margin:0 0 24px;color:#a1a1aa;line-height:1.7}
    textarea{width:100%;min-height:190px;resize:vertical;border:1px solid #3f3f46;border-radius:16px;background:#18181b;color:#fff;padding:16px;font:inherit;line-height:1.7;outline:none}
    textarea:focus{border-color:#71717a;box-shadow:0 0 0 3px rgba(113,113,122,.15)}
    .row{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}
    button{border:0;border-radius:14px;padding:12px 20px;font-weight:700;font-size:15px;cursor:pointer;background:#fafafa;color:#09090b}
    button:disabled{opacity:.5;cursor:not-allowed}
    .hint{font-size:12px;color:#71717a}
    #result{display:none;margin-top:22px;border-top:1px solid #27272a;padding-top:22px}
    .decision{font-size:30px;font-weight:800;margin:0 0 6px}
    .confidence{color:#a1a1aa;margin-bottom:18px}
    .bars{display:grid;gap:10px}
    .barline{display:grid;grid-template-columns:86px 1fr 54px;gap:10px;align-items:center}
    .track{height:9px;background:#27272a;border-radius:999px;overflow:hidden}
    .fill{height:100%;background:#e4e4e7;border-radius:999px}
    .meta{margin-top:18px;font-size:12px;color:#71717a;display:flex;gap:16px;flex-wrap:wrap}
    .error{margin-top:16px;color:#fca5a5;background:#2a1111;border:1px solid #7f1d1d;padding:12px 14px;border-radius:12px;display:none;white-space:pre-wrap}
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">TypeSafe AI · JEV</div>
    <h1>شن القرار؟</h1>
    <p class="sub">اكتب موقف أو إجراء، وJEV يختار بين <b>تنفيذ</b>، <b>مراجعة</b>، أو <b>رفض</b> مع احتمالات كل قرار.</p>

    <textarea id="input" maxlength="12000" placeholder="مثال: العميل طلب استرجاع المبلغ بعد ما تم خصمه مرتين..."></textarea>

    <div class="row">
      <button id="go">خذ القرار</button>
      <span class="hint">القرار احتمالي وليس نصًا مولدًا.</span>
    </div>

    <div id="error" class="error"></div>

    <section id="result">
      <div id="decision" class="decision"></div>
      <div id="confidence" class="confidence"></div>
      <div id="bars" class="bars"></div>
      <div id="meta" class="meta"></div>
    </section>
  </main>

<script>
const labels = { execute: "تنفيذ", review: "مراجعة", reject: "رفض" };
const input = document.getElementById("input");
const go = document.getElementById("go");
const result = document.getElementById("result");
const errorBox = document.getElementById("error");

go.addEventListener("click", async () => {
  const text = input.value.trim();
  if (!text) return;
  go.disabled = true;
  go.textContent = "جاري التقييم...";
  result.style.display = "none";
  errorBox.style.display = "none";

  try {
    const res = await fetch("/api/decide", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "فشل الطلب");

    document.getElementById("decision").textContent = labels[data.decision] || data.decision;
    document.getElementById("confidence").textContent =
      "الثقة في القرار: " + Math.round((data.confidence || 0) * 100) + "%";

    const bars = document.getElementById("bars");
    bars.innerHTML = "";
    for (const key of ["execute","review","reject"]) {
      const p = Number(data.probabilities?.[key] || 0);
      const line = document.createElement("div");
      line.className = "barline";
      line.innerHTML =
        '<span>' + labels[key] + '</span>' +
        '<div class="track"><div class="fill" style="width:' + Math.round(p*100) + '%"></div></div>' +
        '<span>' + Math.round(p*100) + '%</span>';
      bars.appendChild(line);
    }

    document.getElementById("meta").innerHTML =
      "<span>Model: " + data.model + "</span>" +
      "<span>Input tokens: " + (data.usage?.input_tokens ?? "—") + "</span>" +
      "<span>Output tokens: " + (data.usage?.output_tokens ?? "—") + "</span>";

    result.style.display = "block";
  } catch (err) {
    errorBox.textContent = err.message || String(err);
    errorBox.style.display = "block";
  } finally {
    go.disabled = false;
    go.textContent = "خذ القرار";
  }
});
</script>
</body>
</html>
